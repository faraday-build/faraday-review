name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Authorization boundary guard
        run: python tools/guards/authorization_boundary.py src --format github

  workflow-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Install guard dependencies
        run: python -m pip install --quiet pyyaml
      - name: Workflow hardening guard
        run: python tools/guards/workflow_hardening.py .github/workflows

  guard-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --quiet pytest pyyaml
      - name: Guard self-tests
        run: python -m pytest tests/guards -q

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --quiet -e ".[dev]"
      - name: Unit, integration, and adversarial tests
        run: python -m pytest tests/unit tests/integration tests/adversarial -q

  qualification-reproducible:
    # GHO-004 P2: a committed ledger/readiness must re-derive byte-for-byte
    # from the committed archive (vacuous pass while none is committed). On
    # pull requests the base branch's ledger is the prior ledger, so an
    # archived input can never silently disappear. Read-only; no repository secrets are used.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --quiet -e .
      - name: Reproduce committed qualification outputs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          prior=()
          if [ -n "$BASE_REF" ] && git cat-file -e "origin/$BASE_REF:docs/qualification/ledger.json" 2>/dev/null; then
            git show "origin/$BASE_REF:docs/qualification/ledger.json" > "$RUNNER_TEMP/base-ledger.json"
            prior=(--prior-ledger "$RUNNER_TEMP/base-ledger.json")
          fi
          python tools/qualification/reproduce.py --qualification-dir docs/qualification "${prior[@]}"

  determinism-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 7, 19, 43, 101]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --quiet -e ".[dev]"
      - name: Golden-file determinism
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: python -m pytest tests/determinism -q

  determinism:
    # Single required-check context aggregating the seed matrix.
    needs: determinism-seed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All seeds must pass
        env:
          SEED_RESULT: ${{ needs.determinism-seed.result }}
        run: |
          if [ "$SEED_RESULT" != "success" ]; then
            echo "determinism matrix result: $SEED_RESULT" >&2
            exit 1
          fi
