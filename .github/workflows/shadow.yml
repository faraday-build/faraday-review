# Reusable Faraday Review shadow workflow (Phase 1).
#
# Shadow-only: runs the existing deterministic `faraday-review shadow-run`
# against the caller's pull request, publishes one governed summary check
# and comment, and uploads the decision + telemetry as a retained artifact.
# It approves nothing and merges nothing: approval_authorized and
# merge_authorized come only from the pinned policy bundle, which sets both
# false for every risk class in Phase 1.
#
# Callers MUST pin this workflow by full commit SHA and pass the same SHA as
# `reviewer_sha`; the binding is verified against the run's
# referenced_workflows before any reviewer code is checked out. Callers must
# not pass secrets (none are declared) and must trigger on `pull_request`
# only — never `pull_request_target`. See docs/DEPLOYMENT.md.
name: faraday-review-shadow

on:
  workflow_call:
    inputs:
      reviewer_sha:
        description: "Full 40-hex faraday-review commit SHA; must equal the SHA in the caller's `uses:` ref and be reachable from faraday-review main."
        type: string
        required: true
      governance_sha:
        description: "Full 40-hex faraday-capital-systems/faraday-governance commit SHA holding the released review-policy/ bundle."
        type: string
        required: true
      policy_digest:
        description: "Expected policy bundle digest (pass vars.FARADAY_POLICY_DIGEST). Empty or missing => every run Blocks policy_digest_unpinned."
        type: string
        required: false
        default: ""
      required_checks:
        description: "Newline-separated required status-check contexts to verify at the head SHA."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    env:
      REVIEWER_REPO: faraday-build/faraday-review
      GOVERNANCE_REPO: faraday-capital-systems/faraday-governance
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
    steps:
      - name: Validate event and inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEWER_SHA: ${{ inputs.reviewer_sha }}
          GOVERNANCE_SHA: ${{ inputs.governance_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error::faraday-review shadow supports only the pull_request event (got '$EVENT_NAME')."
            exit 2
          fi
          for v in REVIEWER_SHA GOVERNANCE_SHA; do
            if ! printf '%s' "${!v}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::$v must be a full 40-hex commit SHA."
              exit 2
            fi
          done

      - name: Verify reviewer SHA binding
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REVIEWER_SHA: ${{ inputs.reviewer_sha }}
        run: |
          set -euo pipefail
          # The caller's run must reference shadow.yml at exactly REVIEWER_SHA,
          # pinned by that full SHA (not a branch or tag).
          gh api "repos/$CALLER_REPO/actions/runs/$RUN_ID" \
            --jq '.referenced_workflows[] | select(.path | startswith("'"$REVIEWER_REPO"'/.github/workflows/shadow.yml@")) | "\(.sha) \(.path)"' \
            > referenced.txt
          if [ "$(wc -l < referenced.txt)" -ne 1 ]; then
            echo "::error::expected exactly one referenced $REVIEWER_REPO shadow.yml; got:"; cat referenced.txt; exit 2
          fi
          read -r ref_sha ref_path < referenced.txt
          if [ "$ref_sha" != "$REVIEWER_SHA" ] || [ "${ref_path##*@}" != "$REVIEWER_SHA" ]; then
            echo "::error::reviewer_sha binding mismatch: uses=${ref_path##*@} resolved=$ref_sha input=$REVIEWER_SHA"
            exit 2
          fi
          # Only reviewed, merged code: REVIEWER_SHA must be reachable from main.
          status=$(gh api "repos/$REVIEWER_REPO/compare/$REVIEWER_SHA...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::reviewer_sha is not on $REVIEWER_REPO main (compare status: $status)"
            exit 2
          fi
          echo "binding ok: $REVIEWER_SHA ($status)"

      - name: Check out pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Check out reviewer at pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: faraday-build/faraday-review
          ref: ${{ inputs.reviewer_sha }}
          path: .faraday-review
          persist-credentials: false

      - name: Check out policy bundle at pinned SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: faraday-capital-systems/faraday-governance
          ref: ${{ inputs.governance_sha }}
          path: .faraday-governance
          persist-credentials: false

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"

      - name: Install reviewer and gitleaks
        run: |
          set -euo pipefail
          python -m pip install --quiet ./.faraday-review
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Shadow review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FARADAY_POLICY_DIGEST: ${{ inputs.policy_digest }}
          REQUIRED_CHECKS: ${{ inputs.required_checks }}
          CALLER_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/faraday-artifacts"
          mkdir -p "$artifacts"
          args=(--repository "$CALLER_REPO" --pr "$PR_NUMBER"
                --policy-bundle .faraday-governance/review-policy
                --repo-dir target --artifacts-dir "$artifacts")
          while IFS= read -r check; do
            check="${check#"${check%%[![:space:]]*}"}"; check="${check%"${check##*[![:space:]]}"}"
            [ -n "$check" ] && args+=(--required-check "$check")
          done <<< "$REQUIRED_CHECKS"
          # Fork PRs get a read-only token: evaluate and record, never elevate.
          if [ "$HEAD_REPO" != "$CALLER_REPO" ]; then
            echo "fork pull request: publication skipped"
            args+=(--skip-publish)
          fi
          # Empty FARADAY_POLICY_DIGEST is treated as absent => Block.
          faraday-review shadow-run "${args[@]}"

      - name: Record run binding
        if: always()
        env:
          CALLER_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEWER_SHA: ${{ inputs.reviewer_sha }}
          GOVERNANCE_SHA: ${{ inputs.governance_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/faraday-artifacts"
          mkdir -p "$artifacts"
          python - "$artifacts/run-binding.json" <<'PY'
          import json, os, sys
          keys = ["CALLER_REPO", "PR_NUMBER", "HEAD_SHA", "BASE_SHA", "REVIEWER_SHA",
                  "GOVERNANCE_SHA", "RUN_ID", "RUN_ATTEMPT"]
          with open(sys.argv[1], "w") as fh:
              json.dump({k.lower(): os.environ[k] for k in keys}, fh, sort_keys=True, indent=2)
              fh.write("\n")
          PY

      - name: Upload shadow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: faraday-review-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/faraday-artifacts
          retention-days: 90
          if-no-files-found: warn
