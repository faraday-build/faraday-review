[project]
name = "faraday-review"
version = "0.1.0"
description = "Faraday Review — deterministic PR enforcement plane (Phase 1). No model inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tom Rivera" }]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
faraday-review = "faraday_review.cli:main"
faraday-validator = "faraday_review.cli:validator_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faraday_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
